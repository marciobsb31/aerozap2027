spring:
  application:
    name: conversation-ai

server:
  port: ${CONVERSATION_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      servico: ${spring.application.name}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}

aerozap:
  interpretacao:
    # Abaixo deste valor o canal confirma a leitura com a pessoa antes de pesquisar (RF-044).
    limiar-de-confianca: ${INTERPRETACAO_LIMIAR:0.80}
