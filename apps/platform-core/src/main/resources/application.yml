spring:
  application:
    name: platform-core
  datasource:
    # Cada módulo tem seu schema (AGENTS.md). O Flyway cria o schema na primeira execução.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:aerozap}?currentSchema=platform_core
    username: ${POSTGRES_USER:aerozap}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    schemas: platform_core
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:aerozap}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        default-requeue-rejected: false   # depois das tentativas, a mensagem vai para a DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      servico: ${spring.application.name}
  metrics:
    distribution:
      # Publica os baldes do histograma: sem eles não há percentil por rota no painel.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Ambiente local: todos os rastros. Em produção, bem menor (ver docs/architecture/observabilidade.md).
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    metrics:
      export:
        # As métricas são coletadas pelo Prometheus (modelo de puxar); sem isto o OpenTelemetry
        # também tentaria empurrá-las a cada minuto, gerando erro de conexão.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

aerozap:
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
