spring:
  application:
    name: platform-core
  datasource:
    # Cada módulo tem seu schema (AGENTS.md). O Flyway cria o schema na primeira execução.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:aerozap}?currentSchema=platform_core
    username: ${POSTGRES_USER:aerozap}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    # Um schema por módulo (ADR-0002). O primeiro é o padrão das consultas sem prefixo.
    schemas: platform_core,identidade
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:aerozap}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        default-requeue-rejected: false   # depois das tentativas, a mensagem vai para a DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      servico: ${spring.application.name}
  metrics:
    distribution:
      # Publica os baldes do histograma: sem eles não há percentil por rota no painel.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Ambiente local: todos os rastros. Em produção, bem menor (ver docs/architecture/observabilidade.md).
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    metrics:
      export:
        # As métricas são coletadas pelo Prometheus (modelo de puxar); sem isto o OpenTelemetry
        # também tentaria empurrá-las a cada minuto, gerando erro de conexão.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

aerozap:
  outbox:
    poll-interval-ms: 1000
    batch-size: 50

  identidade:
    token:
      # Sem valor padrão de propósito: o módulo não sobe sem segredo configurado. Um padrão aqui
      # é um padrão em produção no dia em que alguém esquecer de definir a variável.
      segredo: ${JWT_SECRET:}
      emissor: ${JWT_EMISSOR:https://aerozap.local/identidade}
      publico: ${JWT_PUBLICO:aerozap-api}
      # Acesso curto porque não é revogável; a sessão é longa porque é, e rotaciona a cada uso.
      validade-do-acesso: 15m
      validade-da-sessao: 30d

  franquia:
    # Decisões do PRD ainda em aberto (RN-02 e RN-12) entram como configuração, nunca como valor
    # fixo no código: é o que permite responder depois sem migrar dados de período.
    plano-padrao: FREE
    tipo-de-periodo: TRIMESTRE_CALENDARIO
    fuso: America/Sao_Paulo
    expiracao-da-reserva: 15m
    conclusao: APENAS_COM_OFERTAS
    intervalo-de-expiracao-ms: 60000
