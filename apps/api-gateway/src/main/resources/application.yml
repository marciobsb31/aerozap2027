spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

server:
  # Porta própria: evita conflito com SERVER_PORT, usado pelos serviços de trás.
  port: ${GATEWAY_PORT:8080}
  # Atrás de balanceador, descomente e garanta que só o balanceador fale com o gateway:
  # forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      servico: ${spring.application.name}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_AMOSTRAGEM:1.0}
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs

aerozap:
  seguranca:
    jwt:
      # Fase 1: segredo compartilhado (HS256). Com o serviço de identidade (AZ-020), troca-se por JWKS.
      segredo: ${JWT_SECRET:}
      emissor: ${JWT_EMISSOR:https://aerozap.local/identidade}
      publico: ${JWT_PUBLICO:aerozap-api}
  limite-de-taxa:
    habilitado: ${LIMITE_HABILITADO:true}
    requisicoes: ${LIMITE_REQUISICOES:120}
    janela: ${LIMITE_JANELA:1m}
  gateway:
    tempos-limite:
      conexao: 2s
      leitura: 15s
    rotas:
      - prefixo: /api/plataforma
        destino: ${DESTINO_PLATFORM_CORE:http://localhost:8081/api}
