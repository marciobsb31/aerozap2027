# Fluxo reutilizável do frontend Angular. Chamado por ci.yml.
# Enquanto não houver frontend/package.json, os passos são pulados e o job termina verde.
name: Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Há código para construir?
        id: has
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "code=true" >> "$GITHUB_OUTPUT"
          else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::frontend ainda não tem package.json; build pulado"; fi

      - uses: actions/setup-node@v4
        if: steps.has.outputs.code == 'true'
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        if: steps.has.outputs.code == 'true'
        run: npm ci

      - name: Auditoria de dependências (falha em crítica)
        if: steps.has.outputs.code == 'true'
        run: npm audit --audit-level=critical

      # O cliente de API é gerado do contrato OpenAPI e versionado. Este passo falha se alguém
      # mudou o contrato sem regenerar o cliente, ou editou o gerado à mão.
      - name: Cliente de API em sincronia com o contrato
        if: steps.has.outputs.code == 'true'
        run: npm run verificar:contrato

      - name: Lint
        if: steps.has.outputs.code == 'true'
        run: npm run lint

      # Cobre as três aplicações/bibliotecas. Inclui a varredura que proíbe texto de interface fora
      # do dicionário e a verificação de acessibilidade com axe-core.
      - name: Testes unitários
        if: steps.has.outputs.code == 'true'
        run: npm test

      - name: Build das bibliotecas
        if: steps.has.outputs.code == 'true'
        run: npm run build:bibliotecas

      - name: Build de produção
        if: steps.has.outputs.code == 'true'
        run: npm run build

      - name: CodeQL (SAST) — início
        if: steps.has.outputs.code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: CodeQL (SAST) — análise
        if: steps.has.outputs.code == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
