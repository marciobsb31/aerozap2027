# AeroZap — coleta de métricas no ambiente local (AZ-013).
# Os serviços Java rodam na máquina (fora do Docker), por isso o alvo é host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: local

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Serviços AeroZap (Spring Boot + Actuator). Acrescente um alvo por serviço conforme forem criados:
  # api-gateway, platform-core, search, conversation-ai, messaging (ADR-0002).
  - job_name: aerozap-servicos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          servico: platform-core

  # RabbitMQ: métricas agregadas do nó.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # RabbitMQ: métricas por fila (profundidade, mensagens não confirmadas, DLQ).
  - job_name: rabbitmq-filas
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["rabbitmq:15692"]
