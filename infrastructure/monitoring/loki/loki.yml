# AeroZap — Loki em modo único (desenvolvimento local, AZ-013).
# Recebe logs direto dos serviços pelo endpoint OTLP nativo: /otlp/v1/logs.
# Retenção curta de propósito: o ambiente local não deve ocupar disco.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 72h
  allow_structured_metadata: true
  reject_old_samples: false
  volume_enabled: true
  # O ambiente local é de uma pessoa só; limites generosos evitam descarte durante os testes.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
